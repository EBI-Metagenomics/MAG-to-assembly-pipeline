name: nf-test
on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

env:
  NXF_ANSI_LOG: false

jobs:
  test:
    name: Run pipeline with test data
    runs-on: ubuntu-latest

    strategy:
      matrix:
        NXF_VER: ["24.10.9"]

    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Setup Nextflow
        uses: nf-core/setup-nextflow@v2.0.0
        with:
          version: "${{ matrix.NXF_VER }}"

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v1
        with:
          install-pdiff: true
          version: 0.9.2

      - name: Run the nf-test
        run: |
          nf-test test --ci --verbose --profile test_local,docker --tag ci

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-outputs
          path: |
            /home/runner/work/MAG-to-assembly-pipeline/MAG-to-assembly-pipeline/.nf-test/
            /home/runner/work/MAG-to-assembly-pipeline/MAG-to-assembly-pipeline/nf-test.log
